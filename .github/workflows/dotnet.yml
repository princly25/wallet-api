name: .NET build and tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SimpleWallet.sln
      - name: Compile
        run: dotnet build SimpleWallet.sln --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test src/SimpleWallet.Tests/Wallet.UnitTests/Wallet.UnitTests.csproj --configuration Release --no-build --verbosity normal
      - name: Start development API and PostgreSQL
        run: docker compose up --build --detach
      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --silent --fail --output /dev/null http://localhost:8080/; then
              exit 0
            fi
            sleep 2
          done
          echo 'API did not start within three minutes'
          docker compose logs --no-color
          exit 1
      - name: Run integration and authorization tests
        run: dotnet test src/SimpleWallet.Tests/Wallet.IntegrationTests/Wallet.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
      - name: Show Docker logs if a step fails
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Docker services
        if: always()
        run: docker compose down --volumes
